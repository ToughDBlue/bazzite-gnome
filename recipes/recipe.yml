---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: bazzite-gnome
# description will be included in the image's metadata
description: Custom Bazzite-Gnome Image

# the base image to build on top of (FROM) and the version tag to use
base-image: ghcr.io/ublue-os/bazzite-gnome
image-version: latest

# module configuration, executed in order
# you can include multiple instances of the same module
modules:
  - type: dnf
    repos:
      files:
        - https://brave-browser-rpm-release.s3.brave.com/brave-browser.repo
    install:
      packages:
        - brave-origin

  - type: script
    snippets:
      - |
        cat > /etc/yum.repos.d/nextcloud-office.repo << 'EOF'
        [nextcloud-office]
        name=Nextcloud Office
        baseurl=https://download.nextcloud.com/office/repo/rpm/stable/$basearch
        enabled=1
        gpgcheck=1
        repo_gpgcheck=1
        gpgkey=https://download.nextcloud.com/office/repo/nextcloud-office.asc
        EOF

  - type: dnf
    install:
      packages:
        - nextcloud-office-nextcloudoffice

#  - type: script
#    snippets:
#      - "curl -fsSL https://raw.githubusercontent.com/yannmasoch/nautilus-my-computer/main/install.sh | sh"
      
  - type: signing # this sets up the proper policy & signing files for signed images to work fully
